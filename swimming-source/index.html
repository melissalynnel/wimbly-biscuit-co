<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Swimming</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #d4a0c8;
        overflow: hidden;
        width: 100vw;
        height: 100vh;        /* fallback */
        height: 100dvh;       /* excludes browser chrome (address bar, tab bar) on mobile */
        padding-bottom: env(safe-area-inset-bottom, 0px); /* home indicator safe area */
      }
      #pool-wrap { position: relative; width: 100%; height: 100%; cursor: none; }
      canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
      #bg, #fg { image-rendering: pixelated; image-rendering: crisp-edges; }
      @media (pointer: coarse) {
        body { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
        #space-slider-wrap { margin-top: 3px; }
      }
    </style>
  </head>
  <body>
    <div id="pool-wrap">
      <canvas id="bg"></canvas>
      <canvas id="text-layer"></canvas>
      <canvas id="fg"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
